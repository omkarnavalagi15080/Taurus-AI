<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Taurus AI</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
    }

    #status {
      text-align: center;
      color: #aaa;
      margin: 15px 0;
    }

    #chat {
      height: 60vh;
      overflow-y: auto;
      padding: 15px;
      background: #1b1b1b;
      border-radius: 12px;
    }

    .message {
      padding: 10px;
      margin: 8px 0;
      border-radius: 10px;
      white-space: pre-wrap;
    }

    .user {
      background: #333;
      text-align: right;
    }

    .bot {
      background: #222;
    }

    .input-area {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    input {
      flex: 1;
      padding: 13px;
      border-radius: 8px;
      border: none;
      font-size: 16px;
    }

    button {
      padding: 13px 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    #send {
      background: white;
      color: black;
    }

    #load {
      display: block;
      margin: 15px auto;
      background: #444;
      color: white;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🤖 Taurus AI</h1>

  <div id="status">
    Local AI is not loaded
  </div>

  <button id="load">
    Load Local AI
  </button>

  <div id="chat"></div>

  <div class="input-area">
    <input
      id="input"
      type="text"
      placeholder="Ask Taurus AI..."
    >

    <button id="send">
      Send
    </button>
  </div>

</div>

<script type="module">

  import {
    CreateMLCEngine
  } from "https://esm.run/@mlc-ai/web-llm";

  const MODEL =
    "Llama-3.2-1B-Instruct-q4f16_1-MLC";

  let engine = null;

  const chat = document.getElementById("chat");
  const input = document.getElementById("input");
  const sendButton = document.getElementById("send");
  const loadButton = document.getElementById("load");
  const status = document.getElementById("status");

  function addMessage(text, type) {

    const div = document.createElement("div");

    div.className = "message " + type;

    div.textContent = text;

    chat.appendChild(div);

    chat.scrollTop = chat.scrollHeight;

    return div;
  }

  loadButton.addEventListener("click", async () => {

    try {

      loadButton.disabled = true;

      status.textContent =
        "Downloading local AI model... Please wait 🤖";

      engine = await CreateMLCEngine(
        MODEL,
        {
          initProgressCallback: (progress) => {

            if (progress.text) {
              status.textContent =
                progress.text;
            }

          }
        }
      );

      status.textContent =
        "✅ Taurus AI is ready!";

      loadButton.textContent =
        "AI Ready";

    } catch (error) {

      console.error(error);

      status.textContent =
        "❌ Local AI could not load.";

      loadButton.disabled = false;

    }

  });

  async function send() {

    const text = input.value.trim();

    if (!text) return;

    if (!engine) {

      addMessage(
        "Please load the Local AI first.",
        "bot"
      );

      return;

    }

    addMessage(
      text,
      "user"
    );

    input.value = "";

    const thinking =
      addMessage(
        "Taurus AI is thinking... 🤖",
        "bot"
      );

    try {

      const response =
        await engine.chat.completions.create({

          messages: [

            {
              role: "system",
              content:
                "You are Taurus AI, a helpful, friendly and concise AI assistant."
            },

            {
              role: "user",
              content: text
            }

          ],

          temperature: 0.7,

          max_tokens: 300

        });

      const reply =
        response.choices[0]?.message?.content ||
        "Sorry, I couldn't generate a response.";

      thinking.textContent =
        reply;

    } catch (error) {

      console.error(error);

      thinking.textContent =
        "⚠️ Local AI error: " +
        error.message;

    }

  }

  sendButton.addEventListener(
    "click",
    send
  );

  input.addEventListener(
    "keydown",
    (event) => {

      if (event.key === "Enter") {
        send();
      }

    }
  );

</script>

</body>
</html>
